name: Account deletion validation
on:
  push:
    branches: [main]
    paths:
      - 'account-deletion.js'
      - 'legal/**'
      - 'app.js'
      - 'supabase/**'
      - 'tests/account-deletion/**'
      - '.github/workflows/account-deletion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deletion:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests/account-deletion --ignore-scripts --no-audit --no-fund
      - name: Database isolation and deletion protocol
        run: node tests/account-deletion/database.cjs
      - name: Existing auth and Marketplace behavior
        run: node --test integration/auth/tests/*.test.mjs integration/marketplace/tests/*.test.mjs integration/community/tests/*.test.mjs
      - name: Install WebKit
        working-directory: tests/account-deletion
        run: npx --no-install playwright install webkit
      - name: WebKit mobile deletion flow
        env:
          TAMOON_TEST_ENGINE: webkit
        run: node tests/account-deletion/web.cjs
      - name: WebKit Apple login and linking with production flags
        env:
          NODE_PATH: ./tests/account-deletion/node_modules
          AUTH_TEST_SDK: /tmp/tamoon-supabase-sdk.js
        run: |
          curl --fail --silent --show-error --location https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.min.js --output "$AUTH_TEST_SDK"
          node integration/auth/tests/browser.cjs
