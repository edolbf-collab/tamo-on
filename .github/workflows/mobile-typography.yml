name: Mobile typography validation
on:
  push:
    branches: [main]
    paths: ['styles.css', 'index.html', 'marketplace/*.css', 'marketplace/index.html', 'mobile/tests/mobile-typography*', '.github/workflows/mobile-typography.yml']
  pull_request:
    paths: ['styles.css', 'index.html', 'marketplace/*.css', 'marketplace/index.html', 'mobile/tests/mobile-typography*', '.github/workflows/mobile-typography.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm run build --prefix mobile
      - run: node --test mobile/tests/admin-metrics.test.mjs
        env:
          METRICS_FIXTURE: /tmp/metrics-fixture.json
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: mobile
      - run: node mobile/tests/mobile-typography.mjs
        env:
          TAMOON_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-typography-${{ matrix.browser }}
          path: /tmp/mobile-typography/*.png
          if-no-files-found: ignore
