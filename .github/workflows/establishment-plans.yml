name: Establishment commercial plans
on:
  push:
    branches: [main]
    paths: ['marketplace/**', 'integration/marketplace/**', 'mobile/tests/admin-commercial*', '.github/workflows/establishment-plans.yml']
  pull_request:
    paths: ['marketplace/**', 'integration/marketplace/**', 'mobile/tests/admin-commercial*', '.github/workflows/establishment-plans.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: node --test mobile/tests/admin-*.test.mjs integration/marketplace/tests/*.test.mjs
        env:
          COMMERCIAL_FIXTURE: /tmp/commercial-fixture.json
      - run: node integration/marketplace/build-assets.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: node mobile/tests/admin-commercial-browser.mjs
      - run: npx --yes deno@2.9.6 check --no-lock integration/marketplace/asaas/functions/establishment-billing/index.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: establishment-plans-preview
          path: /tmp/commercial-preview/*.png
          if-no-files-found: ignore
