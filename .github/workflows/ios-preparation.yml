name: Validar preparação iOS
on:
  workflow_dispatch:
  push:
    branches: [ios-build-165]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verificar Xcode
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          test "$major" -ge 26
      - name: Iniciar simulador durante a compilação
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,rows in devices.items() if "iOS" in runtime for d in rows if d["name"].startswith("iPhone")))')
          echo "TAMOON_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
      - run: npm ci
      - run: npm run sync
      - run: npm run check
      - run: npm run test:auth
      - name: Validar integração e autorização
        run: node --test ../integration/auth/tests/*.test.mjs ../integration/marketplace/tests/*.test.mjs ../integration/community/tests/*.test.mjs
      - name: Validar cifragem e revogação Apple
        working-directory: supabase/functions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes deno@2.9.6 test --node-modules-dir=manual --no-remote --no-lock --allow-env ../../tests/ios-preparation/apple.test.ts
      - name: Compilar para simulador (sem assinatura ou envio)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Validar archive Release para iPhone (sem assinatura ou envio)
        run: |
          set -euo pipefail
          build=$(node -p "require('../version.json').build")
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tamoon.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          python3 scripts/verify-archive.py "$RUNNER_TEMP/Tamoon.xcarchive" "$build"
      - name: Abrir o app no simulador e validar a ponte nativa e o Keychain
        run: |
          gem install --user-install --no-document xcodeproj --version 1.27.0
          bash scripts/native-startup-test.sh
      - name: Guardar evidência de inicialização nativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-startup
          path: |
            mobile/build/NativeStartup.xcresult
            mobile/build/native-startup.png
