name: Administrative operations validation
on:
  pull_request:
    paths: ['admin-community.js', 'marketplace/**', 'supabase/migrations/*admin_operations.sql', 'supabase/migrations/*admin_daily_operations.sql', 'integration/marketplace/supabase/migrations/*admin_operations.sql', 'integration/marketplace/supabase/migrations/*admin_financial_operations.sql', 'integration/marketplace/supabase/migrations/*admin_daily_operations.sql', 'mobile/tests/admin-*', 'tests/admin/**', '.github/workflows/admin-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm ci --prefix tests/admin --no-audit --no-fund && npm test --prefix tests/admin
      - run: node --test mobile/tests/admin-*.test.mjs integration/marketplace/tests/navigation.test.mjs
      - run: npm run build --prefix mobile && npm run check --prefix mobile
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: node mobile/tests/admin-operations-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: administrative-console-preview
          path: /tmp/admin-preview/*.png
          if-no-files-found: ignore
